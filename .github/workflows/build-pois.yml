name: Build nearby places

# «اكتشف ما حولك» without depending on the busy public Overpass servers: every place of the eight
# categories in Iraq from OpenStreetMap, in half-degree squares, on the "pois" branch (replaced each time).
on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 9 * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/pois.py
          sparse-checkout-cone-mode: false
      - name: Places from OpenStreetMap
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          curl -sfL https://download.geofabrik.de/asia/iraq-latest.osm.pbf -o iraq.osm.pbf
          osmium tags-filter iraq.osm.pbf nwr/amenity=fuel,hospital,clinic,doctors,restaurant,fast_food,cafe,pharmacy,bank,atm,marketplace,place_of_worship nwr/shop=supermarket,mall,convenience,department_store nwr/tourism=hotel,motel,guest_house -o pois.osm.pbf --overwrite
          osmium export pois.osm.pbf -f geojsonseq -o pois.geojsonseq --overwrite --geometry-types=point,linestring,polygon
          python3 tools/pois.py pois.geojsonseq out
          du -sh out
      - name: Publish
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b pois
          git config user.name "github-actions[bot]"
          git config user.email "41898599+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "Nearby places $(date -u +%Y-%m-%d)"
          git push -fq "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pois
