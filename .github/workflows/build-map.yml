name: Build Iraq map pack

# Builds the offline Iraq map used by the Mallah app and publishes it as a release.
# Runs on the 1st day of every third month, or manually from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      maxzoom:
        description: "Highest zoom level to include (14 = smaller file, 15 = more detail)"
        default: "15"
      dry_run:
        description: "Only build and report sizes, do not publish"
        default: "false"
  schedule:
    - cron: "17 2 1 */3 *"

permissions:
  contents: write

concurrency:
  group: build-map
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BBOX: "38.79,29.06,48.80,37.39"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          docker pull -q protomaps/go-pmtiles:latest

      - name: Find the newest Protomaps daily build
        run: |
          for i in $(seq 0 10); do
            D=$(date -u -d "-$i day" +%Y%m%d)
            if curl -sfI "https://build.protomaps.com/$D.pmtiles" > /dev/null; then
              echo "BUILD=$D" >> "$GITHUB_ENV"; echo "Using build $D"; exit 0
            fi
          done
          echo "No recent Protomaps build found"; exit 1

      - name: Extract Iraq vector tiles
        run: |
          mkdir -p pack
          MZ="${{ github.event.inputs.maxzoom || '15' }}"
          extract () {
            rm -f pack/iraq.pmtiles
            docker run --rm -v "$PWD/pack:/data" protomaps/go-pmtiles:latest \
              extract "https://build.protomaps.com/$BUILD.pmtiles" /data/iraq.pmtiles --bbox="$BBOX" --maxzoom="$1"
          }
          extract "$MZ"
          SIZE=$(stat -c %s pack/iraq.pmtiles)
          echo "maxzoom $MZ -> $SIZE bytes"
          # keep the download reasonable for phones
          if [ "$SIZE" -gt 480000000 ] && [ "$MZ" -gt 14 ]; then MZ=14; extract 14; fi
          echo "MAXZOOM=$MZ" >> "$GITHUB_ENV"
          ls -la pack

      - name: Fonts and map symbols
        run: |
          base=https://protomaps.github.io/basemaps-assets
          ranges="0-255 256-511 512-767 768-1023 1024-1279 1536-1791 1792-2047 2048-2303 8192-8447 8448-8703 8704-8959 9472-9727 9728-9983 64256-64511 64512-64767 64768-65023 65024-65279 65280-65535"
          for font in "Noto Sans Regular" "Noto Sans Medium" "Noto Sans Italic"; do
            mkdir -p "pack/fonts/$font"
            enc=$(echo "$font" | sed 's/ /%20/g')
            for r in $ranges; do
              curl -sf "$base/fonts/$enc/$r.pbf" -o "pack/fonts/$font/$r.pbf" || rm -f "pack/fonts/$font/$r.pbf"
            done
          done
          mkdir -p pack/sprites
          for f in light dark; do
            for s in "" "@2x"; do
              curl -sf "$base/sprites/v4/$f$s.json" -o "pack/sprites/$f$s.json"
              curl -sf "$base/sprites/v4/$f$s.png"  -o "pack/sprites/$f$s.png"
            done
          done
          test -s "pack/fonts/Noto Sans Regular/1536-1791.pbf"
          du -sh pack/fonts pack/sprites

      - name: Places index for offline search
        run: |
          curl -sfL https://download.geofabrik.de/asia/iraq-latest.osm.pbf -o iraq.osm.pbf
          osmium tags-filter iraq.osm.pbf \
            nwr/place nwr/amenity nwr/shop nwr/tourism nwr/healthcare nwr/office=government \
            nwr/leisure=park,stadium,sports_centre nwr/aeroway=aerodrome nwr/railway=station \
            nwr/public_transport=station nwr/historic nwr/man_made=works,petroleum_well,pumping_station \
            -o filtered.osm.pbf --overwrite
          osmium export filtered.osm.pbf -f geojsonseq -o places.geojsonseq --overwrite \
            --geometry-types=point,polygon
          python3 tools/places.py places.geojsonseq pack/places.tsv
          wc -l pack/places.tsv

      - name: Assemble the map pack
        run: |
          python3 tools/make_pack.py pack "mallah-iraq-map.zip" "$BUILD" "$MAXZOOM" "$BBOX"
          ls -la mallah-iraq-map.zip

      - name: Check the pack and write a report
        run: |
          python3 - <<'PY'
          import zipfile, json, os, struct
          z = zipfile.ZipFile("mallah-iraq-map.zip")
          names = z.namelist()
          t = z.getinfo("iraq.pmtiles")
          assert t.compress_type == zipfile.ZIP_STORED, "tiles must be stored"
          with open("mallah-iraq-map.zip", "rb") as f:
              f.seek(t.header_offset); h = f.read(30)
              n, x = struct.unpack("<HH", h[26:30]); f.seek(t.header_offset + 30 + n + x)
              assert f.read(7) == b"PMTiles", "tiles not readable in place"
          places = sum(1 for _ in open("pack/places.tsv", encoding="utf-8")) - 1
          rep = {"zip_bytes": os.path.getsize("mallah-iraq-map.zip"), "tiles_bytes": t.file_size,
                 "maxzoom": int(os.environ["MAXZOOM"]), "build": os.environ["BUILD"], "entries": len(names),
                 "font_files": sum(1 for n in names if n.startswith("fonts/")), "sprites": sum(1 for n in names if n.startswith("sprites/")),
                 "places": places}
          print(rep)
          os.makedirs("updates", exist_ok=True)
          json.dump(rep, open(f"updates/report-z{rep['maxzoom']}.json", "w"), indent=1)
          PY

      - name: Save report only (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          git config user.name "mallah-bot"
          git config user.email "actions@users.noreply.github.com"
          git add updates/report-*.json
          git commit -m "Map size report (maxzoom $MAXZOOM)" || true
          git pull --rebase -q origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Publish release and update manifest
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          TAG="map-$BUILD"
          SIZE=$(stat -c %s mallah-iraq-map.zip)
          V="${BUILD:0:4}-${BUILD:4:2}-${BUILD:6:2}"
          gh release delete "$TAG" -y --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" mallah-iraq-map.zip \
            --title "خريطة العراق $V" \
            --notes "خريطة العراق للعمل بدون إنترنت في تطبيق الملاح. البيانات © مساهمو OpenStreetMap (ODbL)، الخريطة من Protomaps. أقصى تكبير: $MAXZOOM."
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/mallah-iraq-map.zip"
          python3 - "$V" "$URL" "$SIZE" "$MAXZOOM" <<'PY'
          import json, sys, datetime
          v, url, size, mz = sys.argv[1], sys.argv[2], int(sys.argv[3]), int(sys.argv[4])
          json.dump({"version": v, "url": url, "size": size, "maxzoom": mz,
                     "built": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%MZ")},
                    open("updates/map.json", "w"), ensure_ascii=False, indent=2)
          PY
          git config user.name "mallah-bot"
          git config user.email "actions@users.noreply.github.com"
          git add updates/map.json updates/report-*.json
          git commit -m "Map pack $V" || echo "manifest unchanged"
          git pull --rebase -q origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Keep only the two newest map releases
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          gh release list --limit 50 --json tagName --jq '.[].tagName' | grep '^map-' | sort -r | tail -n +3 | \
            while read t; do gh release delete "$t" -y --cleanup-tag; done || true
