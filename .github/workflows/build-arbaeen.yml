name: Build Arbaeen guide

# «دليل زائر الأربعين»: the places of Karbala, Najaf, Kufa and the road between them from OpenStreetMap,
# with the chosen holy places located in the same data, on the "arbaeen" branch (replaced each time).
on:
  workflow_dispatch:
  schedule:
    - cron: "41 2 12 * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/arbaeen.py
          sparse-checkout-cone-mode: false
      - name: Places from OpenStreetMap (Overpass, just this box)
        run: |
          B="31.88,43.85,32.78,44.55"
          cat > q.txt <<Q
          [out:json][timeout:240];
          (
            nwr["amenity"~"^(place_of_worship|hospital|clinic|doctors|pharmacy|drinking_water|water_point|toilets|police|fire_station|community_centre|social_facility)$"]($B);
            nwr["tourism"~"^(hotel|motel|guest_house|hostel|apartment|attraction|viewpoint)$"]($B);
            nwr["historic"]($B);
            nwr["building"~"^(mosque|shrine)$"]($B);
            nwr["place"="square"]($B);
            nwr["name"~"حسيني|ضريح|مرقد|مقام|العتبة|باب |ساحة|تل |مخيم|بوابة|سيطرة|نصب|وادي السلام|بين الحرمين"]($B);
          );
          out tags center bb;
          Q
          ok=0
          for u in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter; do
            for i in 1 2; do
              c=$(curl -s -A "Mallah-guide-build/1.0 (+https://github.com/mustafasami446-star/mallah)" --data-urlencode "data@q.txt" -o ov.json -w "%{http_code}" "$u"); echo "$u -> $c $(stat -c %s ov.json 2>/dev/null)"
              if [ "$c" = 200 ] && python3 -c "import json,sys; d=json.load(open('ov.json')); sys.exit(0 if len(d.get('elements',[]))>200 else 1)"; then ok=1; break 2; fi
              sleep 30
            done
          done
          [ $ok = 1 ]
          python3 tools/arbaeen.py ov.json out
      - name: Publish
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b arbaeen
          git config user.name "github-actions[bot]"
          git config user.email "41898599+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "Arbaeen guide $(date -u +%Y-%m-%d)"
          git push -fq "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" arbaeen
