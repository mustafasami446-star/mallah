name: adhan probe (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -q faster-whisper
      - run: python3 tools/adhan_fetch.py
      - name: Publish samples
        env: { TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          cd out && git init -q -b adhan-samples && git config user.name bot && git config user.email bot@users.noreply.github.com
          git add . && git commit -qm samples && git push -fq "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" adhan-samples
