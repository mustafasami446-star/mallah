name: adhan probe (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -q "faster-whisper==1.0.3" "av==12.3.0" requests
      - run: python3 tools/adhan_more.py
      - name: Publish samples
        env: { TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          cd out && git init -q -b adhan-more && git config user.name bot && git config user.email bot@users.noreply.github.com
          git add . && git commit -qm samples && git push -fq "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" adhan-more
