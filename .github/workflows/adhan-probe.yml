name: adhan probe (temporary)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: adhan-samples, path: s }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q "faster-whisper==1.0.3" "av==12.3.0" requests
      - run: python3 tools/adhan_fetch.py
