name: net probe (temporary)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          Q='[out:json][timeout:20];nwr["amenity"="pharmacy"](around:6000,30.5085,47.7804);out center 60;'
          for U in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://overpass.kumi.systems/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter https://overpass.osm.jp/api/interpreter; do
            echo "=== $U GET"
            curl -s -o /tmp/b -D - -m 30 -w "time=%{time_total} code=%{http_code}\n" -G --data-urlencode "data=$Q" -H 'Origin: https://mustafasami446-star.github.io' -H 'Accept-Language: ar,en' -H 'User-Agent: Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Safari/604.1' "$U" | grep -iE "^HTTP|access-control|content-type"; head -c 200 /tmp/b; echo
            echo "=== $U POST"
            curl -s -o /tmp/b -D - -m 40 --data-urlencode "data=$Q" -H 'Origin: https://mustafasami446-star.github.io' "$U" | grep -iE "^HTTP|access-control"; head -c 120 /tmp/b; echo
          done
