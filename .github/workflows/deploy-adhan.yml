name: Deploy adhan notifications (Cloudflare)

# The small Cloudflare worker that sends the adhan notification to iPhones and laptops at prayer time.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit + D1:Edit) and CLOUDFLARE_ACCOUNT_ID.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["worker/adhan/**"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Check the secrets
        run: |
          echo "token present: $([ -n "$CLOUDFLARE_API_TOKEN" ] && echo yes || echo NO) (length ${#CLOUDFLARE_API_TOKEN})"
          echo "account present: $([ -n "$CLOUDFLARE_ACCOUNT_ID" ] && echo yes || echo NO) (length ${#CLOUDFLARE_ACCOUNT_ID})"
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::Add CLOUDFLARE_API_TOKEN in Settings → Secrets and variables → Actions"; exit 1; fi
          # the account id is 32 hex characters; if it is missing or wrong, ask Cloudflare which account the token belongs to
          if ! echo "$CLOUDFLARE_ACCOUNT_ID" | grep -qE '^[0-9a-f]{32}$'; then
            ID=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);console.log((j.result&&j.result[0]&&j.result[0].id)||'');if(!j.success)console.error(JSON.stringify(j.errors))}catch(e){}})")
            if [ -z "$ID" ]; then
              ID=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify >/dev/null; curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/memberships" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);console.log((j.result&&j.result[0]&&j.result[0].account&&j.result[0].account.id)||'')}catch(e){}})")
            fi
            echo "account id from the token: $([ -n "$ID" ] && echo found || echo NOT FOUND)"
            if [ -z "$ID" ]; then echo "::error::CLOUDFLARE_ACCOUNT_ID must be the 32-character Account ID"; exit 1; fi
            echo "CLOUDFLARE_ACCOUNT_ID=$ID" >> "$GITHUB_ENV"
          fi
      - name: Database
        working-directory: worker/adhan
        run: |
          npx -y wrangler@4 d1 list --json > d1.json || true
          ID=$(node -e "try{const l=require('./d1.json');const d=l.find(x=>x.name==='mallah-adhan');if(d)console.log(d.uuid)}catch(e){}")
          if [ -z "$ID" ]; then npx -y wrangler@4 d1 create mallah-adhan; npx -y wrangler@4 d1 list --json > d1.json; ID=$(node -e "const l=require('./d1.json');console.log(l.find(x=>x.name==='mallah-adhan').uuid)"); fi
          echo "database $ID"
          sed "s/@@DBID@@/$ID/" wrangler.toml.tpl > wrangler.toml
      - name: Deploy
        working-directory: worker/adhan
        run: |
          npx -y wrangler@4 deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "WORKER URL: $URL"
          curl -s "$URL/key" && echo
